<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>受講生登録</title>
</head>
<body>
<h1>受講生登録</h1>
<form th:action="@{/registerStudent}" th:object="${studentDetail}" method="post">
  <div>
    <label for="studentId">ID:</label>
    <input type="text" id="studentId" th:field="*{student.studentId}" required />
  </div>
  <div>
    <label for="name">名前:</label>
    <input type="text" id="name" th:field="*{student.name}" required />
  </div>
  <div>
    <label for="ruby">ふりがな:</label>
    <input type="text" id="ruby" th:field="*{student.ruby}" required />
  </div>
  <div>
    <label for="nickname">ニックネーム:</label>
    <input type="text" id="nickname" th:field="*{student.nickname}" required />
  </div>
  <div>
    <label for="email">e-mail:</label>
    <input type="text" id="email" th:field="*{student.email}" required />
  </div>
  <div>
    <label for="address">住所:</label>
    <input type="text" id="address" th:field="*{student.address}" required />
  </div>
  <div>
    <label for="phone">Phone:</label>
    <input type="text" id="phone" th:field="*{student.phone}" required />
  </div>
  <div>
    <label for="age">年齢:</label>
    <input type="number" id="age" th:field="*{student.age}" required />
  </div>
  <div>
    <label for="gender">性別:</label>
    <input type="text" id="gender" th:field="*{student.gender}" required />
  </div>
  <div>
    <label for="remark">備考:</label>
    <input type="text" id="remark" th:field="*{student.remark}" required />
  </div>
  <div>
    <label for="isDeleted">退会:</label>
    <input type="checkbox" id="isDeleted" th:field="*{student.isDeleted}" />
  </div>
  <div>
    <button type="submit">登録</button>
  </div>
</form>
</body>
</html>
